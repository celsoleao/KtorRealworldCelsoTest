name: RealWorld API Spec Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  api-spec:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew build -x test

      - name: Start server
        run: ./gradlew run &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server on port 8080..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/tags > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Run RealWorld API spec tests
        run: APIURL=http://localhost:8080 ./spec-api/run-api-tests.sh
        continue-on-error: true
